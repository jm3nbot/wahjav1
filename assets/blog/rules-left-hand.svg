<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Left hand rule diagram</title>
  <desc id="desc">An uncontrolled junction showing priority for the vehicle from the left.</desc>
  <rect width="720" height="420" fill="#f7f5f0"/>
  <rect x="286" y="38" width="148" height="344" fill="#d9ded7"/>
  <rect x="96" y="156" width="528" height="108" fill="#d9ded7"/>
  <path d="M360 38v344M96 210h528" stroke="#fff" stroke-width="5" stroke-dasharray="24 20"/>
  <g fill="#0d2117">
    <rect x="170" y="181" width="78" height="38" rx="10"/>
    <rect x="382" y="284" width="38" height="78" rx="10"/>
  </g>
  <g fill="#d8a12f">
    <circle cx="191" cy="224" r="9"/>
    <circle cx="228" cy="224" r="9"/>
    <circle cx="377" cy="306" r="9"/>
    <circle cx="377" cy="343" r="9"/>
  </g>
  <path d="M260 198h100" stroke="#d8a12f" stroke-width="10" stroke-linecap="round"/>
  <path d="M344 178l34 25-34 25" fill="none" stroke="#d8a12f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="74" y="76" fill="#0d2117" font-family="Geist, Arial, sans-serif" font-size="24" font-weight="700">Left-hand rule</text>
  <text x="74" y="108" fill="#6b746b" font-family="Geist, Arial, sans-serif" font-size="16">No lights or signs: priority comes from the left.</text>
  <text x="460" y="334" fill="#0d2117" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2">YOU WAIT</text>
</svg>
