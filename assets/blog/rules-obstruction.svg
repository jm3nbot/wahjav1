<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Obstruction rule diagram</title>
  <desc id="desc">A junction box with a blocked exit showing that drivers should wait before entering.</desc>
  <rect width="720" height="420" fill="#f7f5f0"/>
  <rect x="284" y="38" width="152" height="344" fill="#d9ded7"/>
  <rect x="96" y="150" width="528" height="120" fill="#d9ded7"/>
  <rect x="286" y="152" width="148" height="116" fill="#f2d477" opacity=".55"/>
  <g stroke="#d8a12f" stroke-width="4" opacity=".85">
    <path d="M292 158l136 104M428 158L292 262"/>
    <path d="M326 152l108 82M394 152l-108 82"/>
  </g>
  <path d="M96 210h528M360 38v344" stroke="#fff" stroke-width="5" stroke-dasharray="22 20"/>
  <g fill="#0d2117">
    <rect x="468" y="184" width="78" height="38" rx="10"/>
    <rect x="340" y="284" width="38" height="78" rx="10"/>
  </g>
  <g fill="#d8a12f">
    <circle cx="489" cy="227" r="9"/>
    <circle cx="526" cy="227" r="9"/>
    <circle cx="335" cy="306" r="9"/>
    <circle cx="335" cy="343" r="9"/>
  </g>
  <path d="M360 270v-54" stroke="#b84848" stroke-width="9" stroke-linecap="round"/>
  <path d="M334 246l26-32 26 32" fill="none" stroke="#b84848" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="74" y="76" fill="#0d2117" font-family="Geist, Arial, sans-serif" font-size="24" font-weight="700">Obstruction rule</text>
  <text x="74" y="108" fill="#6b746b" font-family="Geist, Arial, sans-serif" font-size="16">Do not enter unless you can clear the junction.</text>
  <text x="302" y="205" fill="#0d2117" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2">KEEP CLEAR</text>
</svg>
