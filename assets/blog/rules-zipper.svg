<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Zipper principle diagram</title>
  <desc id="desc">Two traffic streams merging one-by-one using the zipper principle.</desc>
  <rect width="720" height="420" fill="#f7f5f0"/>
  <path d="M116 120h206c82 0 130 62 198 62h84" fill="none" stroke="#d9ded7" stroke-width="78" stroke-linecap="round"/>
  <path d="M116 300h206c82 0 130-62 198-62h84" fill="none" stroke="#d9ded7" stroke-width="78" stroke-linecap="round"/>
  <path d="M116 120h206c82 0 130 62 198 62h84M116 300h206c82 0 130-62 198-62h84" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="22 18"/>
  <g fill="#0d2117">
    <rect x="172" y="96" width="72" height="36" rx="9"/>
    <rect x="252" y="276" width="72" height="36" rx="9"/>
    <rect x="430" y="205" width="72" height="36" rx="9"/>
  </g>
  <g fill="#d8a12f">
    <circle cx="192" cy="137" r="8"/>
    <circle cx="226" cy="137" r="8"/>
    <circle cx="272" cy="317" r="8"/>
    <circle cx="306" cy="317" r="8"/>
    <circle cx="450" cy="246" r="8"/>
    <circle cx="484" cy="246" r="8"/>
  </g>
  <path d="M246 138c52 6 84 34 116 66" fill="none" stroke="#d8a12f" stroke-width="8" stroke-linecap="round"/>
  <path d="M336 206l34 8-9-34" fill="none" stroke="#d8a12f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 280c28-30 61-48 100-54" fill="none" stroke="#d8a12f" stroke-width="8" stroke-linecap="round"/>
  <text x="74" y="76" fill="#0d2117" font-family="Geist, Arial, sans-serif" font-size="24" font-weight="700">Zipper principle</text>
  <text x="74" y="108" fill="#6b746b" font-family="Geist, Arial, sans-serif" font-size="16">In slow merging traffic, alternate one vehicle from each stream.</text>
  <text x="518" y="214" fill="#0d2117" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2">ONE BY ONE</text>
</svg>
